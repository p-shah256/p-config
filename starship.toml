# Minimal starship config (working)
# format = "$character"
# right_format = "$directory$cmd_duration$time$hostname"
format = '''
$directory$cmd_duration$time$hostname$kubernetes$status
$character
'''

# [username]
# show_always = true
# style_user = "bold green"
# style_root = "bold red"
# format = " [$user]($style) "

[directory]
truncation_length = 8

[character]
success_symbol = '[>](bold green)'
error_symbol = '[x](bold red)'
vimcmd_symbol = '[<](bold green)'

[cmd_duration]
min_time = 500
format = '[$duration](bold yellow) '

[time]
disabled = false
time_format = '%y-%m-%d %H:%M:%S'
format = "[$time]($style) "
use_12hr = true

[hostname]
ssh_only = true
format = 'on [$hostname](bold red) '
disabled = false

[kubernetes]
format = '[$context(\($namespace\))](dimmed green) '
disabled = false
detect_env_vars = ['KUBECONFIG']

[status]
format = '[$int](bold yellow) '
disabled = false
pipestatus = true
